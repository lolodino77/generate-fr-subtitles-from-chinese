[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video_ocr"
version = "0.1.0"
description = "OCR local des sous-titres chinois incrustés, traduction française locale et génération de vidéos bilingues."
requires-python = ">=3.11,<3.12"
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
video-ocr = "video_ocr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_ocr = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "models: tests nécessitant des modèles OCR/traduction téléchargés (hors ligne une fois installés)",
    "slow: tests longs (vidéo complète)",
]
addopts = "-ra"
